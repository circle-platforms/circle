# Temporary: locates the problems 1.8.1 fixes. Runs only on this branch and is
# never merged.
name: diagnose 1.8.1
on:
  push:
    branches: [diagnose-1.8.1]
permissions:
  contents: read
jobs:
  win-port:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run package
      - name: Quit with a debugging connection open, then start again on the same port
        shell: pwsh
        run: |
          $env:CIRCLE_DESKTOP_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/Circle-win32-x64/Circle.exe'
          $env:REUSE_ROUNDS = '10'
          node apps/desktop/test/diagnostics/devtools-port-reuse.mjs
