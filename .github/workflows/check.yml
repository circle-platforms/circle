name: Check
# Pull requests and the merge queue: the merge gate. The merge queue runs the check on the commit
# that becomes main, on linux-x64, darwin-arm64 and windows-x64, so a push to main does not run it
# again here; the release workflow runs it on main on the other three release targets
# (linux-arm64, darwin-x64, windows-arm64).
# The gate is the check and a launch of the packaged desktop application on each system; the
# full desktop journeys run in the Desktop workbench workflow and do not gate a merge.
on:
  pull_request:
    # ready_for_review: a draft runs nothing, and marking it ready runs the check
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces the run of the older one
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # A draft pull request is not checked; a skipped job counts as passed, and a draft cannot merge
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # macOS is the job below. Intel macOS, Arm Linux and Arm Windows are checked on main by the
        # release workflow.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # A few minutes normally; a test that waits for good fails here rather than in six hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: node dist/cli.js --version
      # The release workflow runs on a pull request only when it changes how Circle is packaged;
      # every pull request still builds and smoke-tests the package here, on one target
      - if: runner.os == 'Linux'
        run: npm run release:build
      - if: runner.os == 'Linux'
        run: npm run release:smoke
  check-macos:
    # The organization runs five macOS jobs at a time, shared with main and releases. A pull
    # request leaves this one to the merge queue, which runs it on the commit that becomes main;
    # skipped on the pull request, the required check counts as passed there.
    name: check (macos-15)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    # The same steps as check above
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: node dist/cli.js --version
  # The desktop application, packaged and started as a person starts it: the window, the bridge
  # to the main process, a turn against a local model and a clean quit
  # (apps/desktop/test/launch-smoke.mjs). It takes seconds once the package is built.
  launch:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            app: Circle-linux-x64
            executable: Circle-linux-x64/Circle
          - os: windows-latest
            app: Circle-win32-x64
            executable: Circle-win32-x64/Circle.exe
    name: launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The pinned developer tools (Node, gh) from an earlier run, so a build does
      # not download them again; each is used only while its receipt matches it
      - uses: actions/cache@v6
        with:
          path: apps/desktop/dist/tools
          key: developer-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/developer-toolchain.mjs') }}
      - run: npm --prefix apps/desktop run package
        timeout-minutes: 15
      # Chromium's sandbox helper must belong to root and be setuid where unprivileged user
      # namespaces are restricted (Ubuntu 24.04 and later); xvfb-run gives the window a display
      - name: Prepare the Linux display and Chromium sandbox
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          timeout 180 sudo apt-get update -o Acquire::Retries=1
          timeout 240 sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2t64
          helper="apps/desktop/out/${{ matrix.app }}/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Start the packaged application
        timeout-minutes: 8
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm --prefix apps/desktop run test:launch
          else
            npm --prefix apps/desktop run test:launch
          fi
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: launch-smoke-${{ matrix.os }}-${{ github.run_attempt }}
          path: apps/desktop/artifacts/launch-smoke/
          if-no-files-found: ignore
          retention-days: 7
  launch-macos:
    # On the merge queue only, as check (macos-15) is
    name: launch (macos-15)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    # The same steps as launch above
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The pinned developer tools (Node, gh) from an earlier run, so a build does
      # not download them again; each is used only while its receipt matches it
      - uses: actions/cache@v6
        with:
          path: apps/desktop/dist/tools
          key: developer-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/developer-toolchain.mjs') }}
      - run: npm --prefix apps/desktop run package
        timeout-minutes: 15
      - name: Start the packaged application
        timeout-minutes: 8
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/Circle-darwin-arm64/Circle.app"
          export CIRCLE_DESKTOP_EXECUTABLE="$CIRCLE_DESKTOP_APP_PATH/Contents/MacOS/Circle"
          npm --prefix apps/desktop run test:launch
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: launch-smoke-macos-15-${{ github.run_attempt }}
          path: apps/desktop/artifacts/launch-smoke/
          if-no-files-found: ignore
          retention-days: 7
