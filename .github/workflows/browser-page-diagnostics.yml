name: Windows query decoder controlled dependency check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-control:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-decoder-install-home
      - name: Run the frozen old, candidate and payload contexts once
        shell: pwsh
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-decoder-runner-home
          CIRCLE_QUERY_CONTROL_OUTPUT: ${{ github.workspace }}/outputs/windows-query-decoder-controlled
        run: |
          node --import tsx scripts/windows-query-decoder-controlled.ts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: windows-query-decoder-controlled
          path: outputs/windows-query-decoder-controlled/
          if-no-files-found: error
          retention-days: 7
