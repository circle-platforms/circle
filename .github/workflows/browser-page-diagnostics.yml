name: Browser page diagnostics
# Diagnostic branch only (issue #124): when does the packaged Linux window produce its
# first animation frames under the release job's display, compared with the workbench's?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: cold-none, replica: 1, iterations: '12', drop: 'none' }
          - { config: cold-none, replica: 2, iterations: '12', drop: 'none' }
          - { config: cold-app, replica: 1, iterations: '10', drop: 'app' }
          - { config: cold-system, replica: 1, iterations: '10', drop: 'system' }
          - { config: warm, replica: 1, iterations: '6', drop: '' }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run package
      - name: Probe the packaged application's first frames
        shell: bash
        env:
          PROBE_LABEL: ${{ matrix.config }}-${{ matrix.replica }}
          PROBE_SHOW: harness
          PROBE_ITERATIONS: ${{ matrix.iterations }}
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/Circle-linux-x64"
          export CIRCLE_DESKTOP_EXECUTABLE="$CIRCLE_DESKTOP_APP_PATH/Circle"
          dpkg -l | grep -E ' (xvfb|libgtk-3-0t64|libgbm1|libegl-mesa0|mesa-libgallium|libgl1-mesa-dri) ' || true
          grep -n 'XVFBARGS=' "$(command -v xvfb-run)" || true
          timeout 20 xvfb-run -a "$CIRCLE_DESKTOP_EXECUTABLE" 2>&1 | head -5 || true
          helper="$(dirname "$CIRCLE_DESKTOP_EXECUTABLE")/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          drop='sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null'
          app_files="find '$CIRCLE_DESKTOP_APP_PATH' -type f -exec cat {} + > /dev/null"
          system_files="find /usr/lib/x86_64-linux-gnu -maxdepth 2 -type f \\( -name 'libLLVM*' -o -name 'libgallium*' -o -name 'libGL*' -o -name 'libEGL*' -o -name 'libgbm*' -o -name 'libva*' -o -name 'libvulkan*' -o -name 'libdrm*' -o -path '*/dri/*' \\) -exec cat {} + > /dev/null"
          case "${{ matrix.drop }}" in
            none) export PROBE_DROP_CACHES="$drop" ;;
            app) export PROBE_DROP_CACHES="$drop; $app_files" ;;
            system) export PROBE_DROP_CACHES="$drop; $system_files" ;;
            *) unset PROBE_DROP_CACHES ;;
          esac
          echo "PROBE_DROP_CACHES=${PROBE_DROP_CACHES:-}"
          xvfb-run -a node apps/desktop/test/diagnose-frames.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: frames-124-${{ matrix.config }}-${{ matrix.replica }}
          path: outputs/frames-124/
          if-no-files-found: ignore
          retention-days: 7
