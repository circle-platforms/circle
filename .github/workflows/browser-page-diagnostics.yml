name: Windows native process query controlled acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-control:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-native-install-home
      - run: npm run build
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-native-build-home
      - name: Run each frozen consumer once
        shell: pwsh
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-native-runner-home
          CIRCLE_NATIVE_CONTROL_OUTPUT: ${{ github.workspace }}/outputs/windows-native-controlled
        run: |
          node --import tsx scripts/windows-native-controlled.ts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: windows-native-controlled
          path: outputs/windows-native-controlled/
          if-no-files-found: error
          retention-days: 7
