name: Browser page diagnostics
on:
  pull_request:
    paths:
      - 'apps/desktop/test/browser-page.mjs'
      - 'apps/desktop/test/browser-input-native.mjs'
      - 'apps/desktop/test/browser-input-focus.mjs'
      - 'src/browser/page.ts'
      - '.github/workflows/browser-page-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces the run of the older one; macOS runners are scarce
concurrency:
  group: browser-page-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  page-x64:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: node -e "console.log(require('./apps/desktop/node_modules/electron'))"
      # Compare actual adapter effects and raw CDP focus/target routing first.
      # Keep all evidence even when an earlier comparison fails.
      - run: node apps/desktop/test/browser-input-native.mjs
      - run: node apps/desktop/test/browser-input-focus.mjs
        if: always()
      # This standalone fixture creates only local HTTP pages and isolated profiles.
      - run: node apps/desktop/test/browser-page.mjs
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circle-browser-page-x64-diagnostics
          path: outputs/browser-regressions/*metadata.json
          if-no-files-found: ignore
          retention-days: 7
