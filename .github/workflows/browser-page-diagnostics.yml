name: Windows legacy query stage diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-query:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-query-install-home
      - name: Run each frozen context once
        shell: pwsh
        env:
          CIRCLE_HOME: ${{ runner.temp }}/circle-query-runner-home
          CIRCLE_LEGACY_DIAG_OUTPUT: ${{ github.workspace }}/outputs/windows-legacy-query
        run: |
          node --import tsx scripts/windows-legacy-query-diagnostic.ts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: windows-legacy-query-stages
          path: outputs/windows-legacy-query/
          if-no-files-found: error
          retention-days: 7
