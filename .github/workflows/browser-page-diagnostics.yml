name: Browser page diagnostics
# Diagnostic branch only (issue #124): can the GPU process be held back on Linux?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hold:
    strategy:
      fail-fast: false
      matrix:
        build: [packaged, development]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - run: node -e "console.log(require('./apps/desktop/node_modules/electron'))"
      - run: npm --prefix apps/desktop run package
      - name: Probe holding the GPU process back
        shell: bash
        run: |
          if [ "${{ matrix.build }}" = packaged ]; then
            export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/Circle-linux-x64"
            export CIRCLE_DESKTOP_EXECUTABLE="$CIRCLE_DESKTOP_APP_PATH/Circle"
            helper="$CIRCLE_DESKTOP_APP_PATH/chrome-sandbox"
          else
            helper="$GITHUB_WORKSPACE/apps/desktop/node_modules/electron/dist/chrome-sandbox"
          fi
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          xvfb-run -a node apps/desktop/test/diagnose-hold.mjs
