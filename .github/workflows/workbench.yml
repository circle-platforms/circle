name: Desktop workbench
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'src/**'
      - 'package*.json'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  pull_request:
    # ready_for_review: a draft runs nothing, and marking it ready runs the jobs
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/**'
      - 'src/**'
      - 'package*.json'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces the run of the older one. Each push to main has a group
# of its own, so every commit of main is checked and none waits behind or replaces another: macOS
# runs only there, and the release workflow leaves the packaged journeys on main to this one.
concurrency:
  group: workbench-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    # A draft pull request runs nothing
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs Linux; main adds Apple silicon and Intel macOS. The organization runs
        # five macOS jobs at a time, shared with main and releases.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"runner": "ubuntu-24.04", "target": "linux-x64", "app": "Circle-linux-x64", "executable": "Circle-linux-x64/Circle"}
          ]' || '[
          {"runner": "macos-15", "target": "darwin-arm64", "app": "Circle-darwin-arm64/Circle.app", "executable": "Circle-darwin-arm64/Circle.app/Contents/MacOS/Circle"},
          {"runner": "macos-15-intel", "target": "darwin-x64", "app": "Circle-darwin-x64/Circle.app", "executable": "Circle-darwin-x64/Circle.app/Contents/MacOS/Circle"},
          {"runner": "ubuntu-24.04", "target": "linux-x64", "app": "Circle-linux-x64", "executable": "Circle-linux-x64/Circle"}
          ]') }}
    runs-on: ${{ matrix.runner }}
    env:
      CIRCLE_NATIVE_JOURNEY_WEB_DEBUG: '1'
      # Retain independent phase evidence; failed or blocked phases still fail the job.
      CIRCLE_NATIVE_JOURNEY_DIAGNOSTIC: '1'
      # PUSH measures browser Console/CDP/IPC delivery, not a remote Git push.
      CIRCLE_NATIVE_JOURNEY_PUSH: '1'
    # The development application runs test:desktop and test:live at both viewport widths and
    # the native developer journey; on main the packaged application repeats them. A pull
    # request packages the application and updates the package, and the Check workflow's launch
    # already starts a package on every pull request.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The pinned developer tools (Node, gh) from an earlier run, so a build does
      # not download them again; each is used only while its receipt matches it
      - uses: actions/cache@v6
        with:
          path: apps/desktop/dist/tools
          key: developer-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/developer-toolchain.mjs') }}
      # Electron 44 resolves its development binary lazily, after npm ci.
      - name: Resolve the development Electron binary before configuring its sandbox
        run: node -e "console.log(require('./apps/desktop/node_modules/electron'))"
      - name: Record the native test environment
        shell: bash
        run: |
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          openssl version
      - name: Start an isolated Linux display and retain the Chromium sandbox
        if: runner.os == 'Linux'
        # A slow package mirror fails here within minutes rather than holding the job
        timeout-minutes: 8
        shell: bash
        run: |
          timeout 180 sudo apt-get update -o Acquire::Retries=1
          timeout 240 sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1920x1080x24 > "$RUNNER_TEMP/circle-xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/apps/desktop/node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - run: npm --prefix apps/workbench run format:check
      - run: npm --prefix apps/desktop run format:check
      - run: npm --prefix apps/workbench test
      - name: Compare desktop appearance on Apple silicon
        if: matrix.target == 'darwin-arm64'
        timeout-minutes: 10
        run: |
          node apps/workbench/node_modules/playwright/cli.js install chromium
          npm --prefix apps/workbench run test:visual
      - run: npm --prefix apps/desktop test
        timeout-minutes: 5
      - name: Verify native developer tool resources
        timeout-minutes: 5
        run: node --test apps/desktop/test/developer-toolchain.test.mjs apps/desktop/test/journey-platform.test.mjs
      - run: npm --prefix apps/desktop run test:runtime
        # Bound leaked native handles without forcing tests to report success.
        timeout-minutes: 20
      - run: npm --prefix apps/desktop run build
      - run: node apps/desktop/scripts/developer-toolchain.mjs
      - run: node apps/desktop/test/developer-toolchain-smoke.mjs
      - run: npm --prefix apps/desktop run test:desktop
      - run: npm --prefix apps/desktop run test:live
      - run: CIRCLE_DESKTOP_TEST_WIDTH=1024 npm --prefix apps/desktop run test:live
      - run: cp apps/desktop/artifacts/desktop/receipt.json apps/desktop/artifacts/desktop/development-receipt.json
      - name: Exercise the native developer journey in development
        timeout-minutes: 20
        run: node apps/desktop/test/native-developer-journey.mjs
      - run: npm --prefix apps/desktop run test:interface
      # The build step above already built dist/, which the tests since have used
      - run: npm --prefix apps/desktop run package:only
      - name: Prepare the packaged application
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          if [ "$RUNNER_OS" = Linux ]; then
            helper="$(dirname "$CIRCLE_DESKTOP_EXECUTABLE")/chrome-sandbox"
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
          fi
          node apps/desktop/test/developer-toolchain-smoke.mjs
      # A pull request runs these in the development application above; main repeats them in
      # the packaged one
      - name: Check the packaged application
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          npm --prefix apps/desktop run test:desktop
          cp apps/desktop/artifacts/desktop/receipt.json apps/desktop/artifacts/desktop/packaged-receipt.json
          npm --prefix apps/desktop run test:live
          CIRCLE_DESKTOP_TEST_WIDTH=1024 npm --prefix apps/desktop run test:live
      # A pull request runs the journey in development above; main repeats it in the packaged
      # application, before the update replaces it.
      - name: Exercise the native developer journey in the packaged application
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          node apps/desktop/test/native-developer-journey.mjs
      - name: Update the packaged application
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          npm --prefix apps/desktop run test:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circle-desktop-${{ matrix.target }}-native
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.tar.gz
            apps/desktop/out/*.sha256
            apps/desktop/out/artifact-receipt.json
            apps/desktop/artifacts/
            apps/workbench/artifacts/visual/
            outputs/
            ${{ runner.temp }}/circle-xvfb.log
          if-no-files-found: error
  # The renderer component journeys, sharded: 64 Chromium journeys in one
  # serial step shared a single 20-minute budget, and a runner running at
  # half speed starved the tail of the list (#296). Three parallel jobs run
  # interleaved thirds of the same ordered list, each with budgets of its
  # own. The journeys launch headless Chromium, so this job needs no
  # display; it does need the desktop install, because the terminal suites
  # import the desktop terminal manager and its node-pty.
  components:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The browser download is cached between runs; its key follows the
      # workbench lockfile, which pins the Playwright version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/workbench/package-lock.json') }}
      # The install has a budget of its own, outside the journeys' step: a
      # slow package mirror once spent minutes of a journeys budget on apt
      # downloads, and the step timed out mid-journey with the suite healthy.
      - name: Install the component journey browser
        timeout-minutes: 20
        shell: bash
        run: |
          unset CIRCLE_TEST_BROWSER_CHANNEL
          node apps/workbench/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run the renderer component journeys (shard ${{ matrix.shard }} of 3)
        timeout-minutes: 20
        shell: bash
        run: |
          unset CIRCLE_TEST_BROWSER_CHANNEL
          npm --prefix apps/workbench run test:components -- --shard ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circle-component-ui-shard-${{ matrix.shard }}
          path: apps/desktop/artifacts/component-ui/
          if-no-files-found: ignore
  # The desktop runtime tests on Windows, in a job of their own beside the packaging below:
  # together they were the longest job of the workflow.
  runtime-other-platforms:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The pinned developer tools (Node, gh) from an earlier run, so a build does
      # not download them again; each is used only while its receipt matches it
      - uses: actions/cache@v6
        with:
          path: apps/desktop/dist/tools
          key: developer-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/developer-toolchain.mjs') }}
      - run: npm --prefix apps/desktop run test:runtime
        # Bound leaked native handles without forcing tests to report success.
        timeout-minutes: 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: circle-desktop-${{ matrix.os }}-runtime
          path: apps/desktop/artifacts/
          if-no-files-found: ignore
  package-other-platforms:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CIRCLE_NATIVE_JOURNEY_WEB_DEBUG: '1'
      # Retain independent phase evidence; failed or blocked phases still fail the job.
      CIRCLE_NATIVE_JOURNEY_DIAGNOSTIC: '1'
      # PUSH measures browser Console/CDP/IPC delivery, not a remote Git push.
      CIRCLE_NATIVE_JOURNEY_PUSH: '1'
    # Packaging, the native developer journey (12m each; the packaged one on main only), the
    # MSI update (15m) and artifact upload. The runtime tests are the job above.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # The pinned developer tools (Node, gh) from an earlier run, so a build does
      # not download them again; each is used only while its receipt matches it
      - uses: actions/cache@v6
        with:
          path: apps/desktop/dist/tools
          key: developer-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/developer-toolchain.mjs') }}
      - name: Install the WiX Toolset
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
      - name: Verify native developer tool resources
        timeout-minutes: 5
        run: node --test apps/desktop/test/developer-toolchain.test.mjs apps/desktop/test/journey-platform.test.mjs
      - run: npm --prefix apps/desktop run package
      - run: node apps/desktop/test/developer-toolchain-smoke.mjs
      - name: Exercise the development application on Windows
        timeout-minutes: 15
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix apps/desktop run test:desktop
          node apps/desktop/test/native-developer-journey.mjs
      # test:desktop in the packaged application on main only, as on the other systems
      - name: Check invalid browser addresses on Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop/test/browser-address.mjs
          $env:CIRCLE_DESKTOP_APP_PATH = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/Circle-win32-x64'
          $env:CIRCLE_DESKTOP_EXECUTABLE = Join-Path $env:CIRCLE_DESKTOP_APP_PATH 'Circle.exe'
          node apps/desktop/test/developer-toolchain-smoke.mjs
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') { npm --prefix apps/desktop run test:desktop }
          node apps/desktop/test/browser-address.mjs
      - name: Exercise the native developer journey in the packaged application on Windows
        if: github.event_name != 'pull_request'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CIRCLE_DESKTOP_APP_PATH = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/Circle-win32-x64'
          $env:CIRCLE_DESKTOP_EXECUTABLE = Join-Path $env:CIRCLE_DESKTOP_APP_PATH 'Circle.exe'
          node apps/desktop/test/native-developer-journey.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circle-windows-browser-address
          path: apps/desktop/artifacts/browser-address/
          if-no-files-found: ignore
      # The release workflow installs and removes it; here it only has to build and validate
      - name: Build the MSI
        run: npm --prefix apps/desktop run package:msi
      - name: Inspect the compiled MSI
        run: npm --prefix apps/desktop run test:msi
      # The installed MSI updates itself to a newer MSI through the application
      - name: Update the installed application
        timeout-minutes: 15
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/Circle-win32-x64"
          export CIRCLE_DESKTOP_EXECUTABLE="$CIRCLE_DESKTOP_APP_PATH/Circle.exe"
          version="$(node -p "require('./package.json').version")"
          export CIRCLE_DESKTOP_UPDATE_MSI="$GITHUB_WORKSPACE/apps/desktop/out/circle-desktop-$version-windows-x64.msi"
          npm --prefix apps/desktop run test:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circle-desktop-${{ matrix.os }}-development
          path: apps/desktop/artifacts/
          if-no-files-found: error
      # The packaged folder and the MSI, several hundred MB, only when there is a failure to read
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: circle-desktop-${{ matrix.os }}-out
          path: apps/desktop/out/
          if-no-files-found: ignore
