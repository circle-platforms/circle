name: Desktop visual baseline capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: node apps/workbench/node_modules/playwright/cli.js install chromium
      - name: Capture candidate screenshots on the reference platform
        shell: bash
        run: |
          export CIRCLE_HOME="$(mktemp -d)"
          export CIRCLE_WORKBENCH_DATA_DIR="$(mktemp -d)"
          npm --prefix apps/workbench run test:visual -- --update-snapshots=changed
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: circle-settings-visual-candidate
          path: |
            apps/workbench/test/visual/baselines/darwin
            apps/workbench/artifacts/visual/results
          retention-days: 7
          if-no-files-found: error
