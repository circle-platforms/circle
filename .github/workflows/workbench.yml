name: Desktop workbench
on:
  push:
    paths:
      - 'apps/**'
      - 'src/**'
      - 'package*.json'
      - 'src/tui/slash_commands.ts'
      - 'src/ink/theme.ts'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'src/**'
      - 'package*.json'
      - 'src/tui/slash_commands.ts'
      - 'src/ink/theme.ts'
      - 'docs/workbench/**'
      - '.github/workflows/workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            app: Circle-darwin-arm64/Circle.app
            executable: Circle-darwin-arm64/Circle.app/Contents/MacOS/Circle
          - runner: macos-15-intel
            target: darwin-x64
            app: Circle-darwin-x64/Circle.app
            executable: Circle-darwin-x64/Circle.app/Contents/MacOS/Circle
          - runner: ubuntu-24.04
            target: linux-x64
            app: Circle-linux-x64
            executable: Circle-linux-x64/Circle
    runs-on: ${{ matrix.runner }}
    # Both application modes and both viewport widths run on each native architecture.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      # Electron 44 resolves its development binary lazily, after npm ci.
      - name: Resolve the development Electron binary before configuring its sandbox
        run: node -e "console.log(require('./apps/desktop/node_modules/electron'))"
      - name: Record the native test environment
        shell: bash
        run: |
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          openssl version
      - name: Start an isolated Linux display and retain the Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1920x1080x24 > "$RUNNER_TEMP/circle-xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/apps/desktop/node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - run: npm --prefix apps/workbench run format:check
      - run: npm --prefix apps/desktop run format:check
      - run: npm --prefix apps/workbench test
      - run: npm --prefix apps/desktop test
      - name: Verify native developer tool resources
        run: node --test apps/desktop/test/developer-toolchain.test.mjs
      - run: npm --prefix apps/desktop run test:runtime
      - run: npm --prefix apps/desktop run build
      - run: node apps/desktop/scripts/developer-toolchain.mjs
      - run: node apps/desktop/test/developer-toolchain-smoke.mjs
      - run: npm --prefix apps/desktop run test:desktop
      - run: npm --prefix apps/desktop run test:live
      - run: CIRCLE_DESKTOP_TEST_WIDTH=1024 npm --prefix apps/desktop run test:live
      - run: cp apps/desktop/artifacts/desktop/receipt.json apps/desktop/artifacts/desktop/development-receipt.json
      - run: npm --prefix apps/desktop run test:interface
      - run: npm --prefix apps/desktop run package
      - name: Check the packaged application
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          if [ "$RUNNER_OS" = Linux ]; then
            helper="$(dirname "$CIRCLE_DESKTOP_EXECUTABLE")/chrome-sandbox"
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
          fi
          node apps/desktop/test/developer-toolchain-smoke.mjs
          npm --prefix apps/desktop run test:desktop
          cp apps/desktop/artifacts/desktop/receipt.json apps/desktop/artifacts/desktop/packaged-receipt.json
          npm --prefix apps/desktop run test:live
          CIRCLE_DESKTOP_TEST_WIDTH=1024 npm --prefix apps/desktop run test:live
          npm --prefix apps/desktop run test:update
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: circle-desktop-${{ matrix.target }}-native
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.tar.gz
            apps/desktop/out/*.sha256
            apps/desktop/out/artifact-receipt.json
            apps/desktop/artifacts/
            outputs/
            ${{ runner.temp }}/circle-xvfb.log
          if-no-files-found: error
  package-other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - name: Install the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
      - name: Verify native developer tool resources
        run: node --test apps/desktop/test/developer-toolchain.test.mjs
      - run: npm --prefix apps/desktop run test:runtime
      - run: npm --prefix apps/desktop run package
      - run: node apps/desktop/test/developer-toolchain-smoke.mjs
      - name: Check invalid browser addresses on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/desktop/test/browser-address.mjs
          $env:CIRCLE_DESKTOP_APP_PATH = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/out/Circle-win32-x64'
          $env:CIRCLE_DESKTOP_EXECUTABLE = Join-Path $env:CIRCLE_DESKTOP_APP_PATH 'Circle.exe'
          node apps/desktop/test/developer-toolchain-smoke.mjs
          node apps/desktop/test/browser-address.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: runner.os == 'Windows' && always()
        with:
          name: circle-windows-browser-address
          path: apps/desktop/artifacts/browser-address/
          if-no-files-found: ignore
      # The release workflow installs and removes it; here it only has to build and validate
      - name: Build the MSI
        if: runner.os == 'Windows'
        run: npm --prefix apps/desktop run package:msi
      - name: Inspect the compiled MSI
        if: runner.os == 'Windows'
        run: npm --prefix apps/desktop run test:msi
      # The installed MSI updates itself to a newer MSI through the application
      - name: Update the installed application
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/Circle-win32-x64"
          export CIRCLE_DESKTOP_EXECUTABLE="$CIRCLE_DESKTOP_APP_PATH/Circle.exe"
          version="$(node -p "require('./package.json').version")"
          export CIRCLE_DESKTOP_UPDATE_MSI="$GITHUB_WORKSPACE/apps/desktop/out/circle-desktop-$version-windows-x64.msi"
          npm --prefix apps/desktop run test:update
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: circle-desktop-${{ matrix.os }}-development
          path: apps/desktop/out/
          if-no-files-found: error
