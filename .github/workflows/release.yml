name: release

# Every push builds the runtime-inclusive package on six targets and smoke-tests it: install,
# relocation, upgrade, checksum rejection, replacing a Python circle, a real tool turn. It also
# packages the desktop application on four targets and runs each package.
# Push a tag vX.Y.Z and the same run publishes one GitHub Release once every target passed.
# Steps to cut one: docs/development/releasing.md. A manual run never publishes.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Tag, version files and changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm run -s release -- --check "${GITHUB_REF_NAME#v}"
      - run: npm run check
      - run: npm run format:check
      - run: npm run release:build
      - run: npm run release:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: circle-${{ matrix.target }}
          path: .tmp/release/*
          if-no-files-found: error
          retention-days: 3

  # The desktop application, built and run as a user gets it: a signed-ad-hoc .dmg on macOS,
  # a .zip on Windows, a .tar.gz on Linux, each started from the package before it is published.
  desktop:
    name: desktop (${{ matrix.target }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            app: Circle-darwin-arm64/Circle.app
            executable: Circle-darwin-arm64/Circle.app/Contents/MacOS/Circle
          - runner: macos-15-intel
            target: darwin-x64
            app: Circle-darwin-x64/Circle.app
            executable: Circle-darwin-x64/Circle.app/Contents/MacOS/Circle
          - runner: windows-2025
            target: windows-x64
            app: Circle-win32-x64
            executable: Circle-win32-x64/Circle.exe
          - runner: ubuntu-24.04
            target: linux-x64
            app: Circle-linux-x64
            executable: Circle-linux-x64/Circle
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/workbench test
      - run: npm --prefix apps/desktop run test:runtime
      - run: npm --prefix apps/desktop run package
      - name: Run the packaged application
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          run=()
          if [ "$RUNNER_OS" = Linux ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns || true
            # As a user who only unpacked the archive starts it
            timeout 20 xvfb-run -a "$CIRCLE_DESKTOP_EXECUTABLE" 2>&1 | head -20 || true
            # Chromium's sandbox helper must belong to root and be setuid where unprivileged
            # user namespaces are restricted (Ubuntu 24.04 and later)
            helper="$(dirname "$CIRCLE_DESKTOP_EXECUTABLE")/chrome-sandbox"
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
            run=(xvfb-run -a)
          fi
          "${run[@]}" npm --prefix apps/desktop run test:desktop
          "${run[@]}" npm --prefix apps/desktop run test:live
      - uses: actions/upload-artifact@v7
        with:
          name: circle-desktop-${{ matrix.target }}
          path: apps/desktop/out/circle-desktop-*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -s "dist-release/circle-$VERSION-$target.tar.gz"
            test -s "dist-release/circle-$VERSION-$target.tar.gz.sha256"
          done
          for target in windows-x64 windows-arm64; do
            test -s "dist-release/circle-$VERSION-$target.zip"
            test -s "dist-release/circle-$VERSION-$target.zip.sha256"
          done
          for asset in darwin-arm64.dmg darwin-x64.dmg windows-x64.zip linux-x64.tar.gz; do
            test -s "dist-release/circle-desktop-$VERSION-$asset"
            test -s "dist-release/circle-desktop-$VERSION-$asset.sha256"
          done
          test "$(ls dist-release | wc -l)" -eq 20
          cp install.sh install.ps1 dist-release/
          cd dist-release
          sha256sum --check circle-*.sha256
          sha256sum circle-*.tar.gz circle-*.zip circle-*.dmg install.sh install.ps1 > SHA256SUMS
          ls -l
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            npm run -s release -- --notes "$VERSION"
            echo
            sed -e "s/@VERSION@/${VERSION}/g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                -e "s|@TAG@|${GITHUB_REF_NAME}|g" .github/release-install.md
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("existing-release.json")).isDraft) throw Error("refusing to overwrite a published release")'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Circle ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json
          node -e '
            const fs = require("fs");
            const expected = Object.fromEntries(fs.readdirSync("dist-release").map((name) => [name, fs.statSync("dist-release/" + name).size]));
            const actual = Object.fromEntries(JSON.parse(fs.readFileSync("release-assets.json")).assets.map((asset) => [asset.name, asset.size]));
            require("assert").deepStrictEqual(actual, expected);
          '
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file notes.md
