<!-- @dsCard group="反馈" height=170 subtitle="成功可撤销，失败不自动消失" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title>
<style>
  .pv { display: flex; flex-direction: column; gap: 12px; padding: 24px; }
</style>
</head>
<body>
<div id="root" class="pv">
  <div class="ch-toast" role="status"><span class="ch-dot ch-dot--pass"></span><span>已分享到团队</span><a href="#">撤销</a></div>
  <div class="ch-toast" role="alert">
    <span class="ch-dot ch-dot--fail"></span>
    <span>分享未完成：来源“部署手册.pdf”无法打开。</span>
    <a href="#">查看来源</a>
    <button class="ch-btn ch-btn--ghost ch-btn--sm" aria-label="关闭" title="关闭"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
</div>
</body>
</html>
