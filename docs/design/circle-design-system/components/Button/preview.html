<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>
  body { background: var(--surface-1); }
  .pv { display: flex; flex-direction: column; gap: 16px; padding: 24px; }
  .pv > div { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div id="root" class="pv">
  <div>
    <button class="ch-btn ch-btn--primary">新建</button>
    <button class="ch-btn ch-btn--secondary">分享到团队…</button>
    <button class="ch-btn ch-btn--ghost">版本记录</button>
    <button class="ch-btn ch-btn--danger">收回分享</button>
  </div>
  <div>
    <button class="ch-btn ch-btn--primary ch-btn--sm">保存</button>
    <button class="ch-btn ch-btn--secondary ch-btn--sm">导入文件</button>
    <button class="ch-btn ch-btn--ghost ch-btn--sm" aria-label="复制链接" title="复制链接">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5l3-3"/><path d="M7.2 4.6l.9-.9a2.6 2.6 0 0 1 3.7 3.7l-.9.9"/><path d="M8.8 11.4l-.9.9a2.6 2.6 0 0 1-3.7-3.7l.9-.9"/></svg>
    </button>
  </div>
  <div>
    <button class="ch-btn ch-btn--primary" aria-busy="true">确认分享到团队</button>
    <button class="ch-btn ch-btn--secondary" disabled>分享…</button>
  </div>
</div>
</body>
</html>
