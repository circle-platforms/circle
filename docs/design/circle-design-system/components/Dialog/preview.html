<!-- @dsCard group="浮层" height=600 width=760 subtitle="分享到团队：检查通过后再确认" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div id="root" class="ch-dialog is-inline area-knowledge">
  <div class="ch-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="ch-dialog-head">
      <h2 class="ch-dialog-title" id="dt">分享到团队</h2>
      <button class="ch-btn ch-btn--ghost ch-btn--sm" aria-label="关闭" title="关闭">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="ch-dialog-body">
      <div class="ch-meta">登录接口在会话过期时返回 401</div>
      <div class="ch-field">
        <label class="ch-field-label" for="dest">团队中的位置</label>
        <div class="ch-input"><select id="dest"><option>团队 › 接口规范</option><option>团队 › 部署</option></select></div>
      </div>
      <div class="ch-section">
        <h3 class="ch-section-label">分享前检查</h3>
        <ul class="ch-checklist">
          <li><div>来源可以打开<div class="ch-meta">2 个来源均已定位</div></div><span class="ch-badge ch-badge--pass"><span class="ch-dot ch-dot--pass"></span>通过</span></li>
          <li><div>不含密钥、口令等敏感信息</div><span class="ch-badge ch-badge--pass"><span class="ch-dot ch-dot--pass"></span>通过</span></li>
          <li><div>团队中已有这条知识<div class="ch-meta">分享后替换团队中的旧版本，旧版本保留在版本记录中</div></div><span class="ch-badge ch-badge--warn"><span class="ch-dot ch-dot--warn"></span>将替换</span></li>
        </ul>
      </div>
      <div class="ch-meta">分享后团队全员可见。</div>
    </div>
    <div class="ch-dialog-foot">
      <button class="ch-btn ch-btn--secondary">取消</button>
      <button class="ch-btn ch-btn--primary">确认分享到团队</button>
    </div>
  </div>
</div>
</body>
</html>
