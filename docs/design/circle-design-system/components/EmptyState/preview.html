<!-- @dsCard group="反馈" height=400 subtitle="空文件夹 · 没有搜索结果" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>EmptyState — preview</title>
<style>
  body { background: var(--surface-1); }
  .pv { display: flex; flex-direction: column; gap: 20px; padding: 24px; }
</style>
</head>
<body>
<div id="root" class="pv area-knowledge">
  <div class="ch-empty">
    <h3 class="ch-empty-title">这个文件夹还没有知识</h3>
    <p class="ch-empty-text">新建一条知识，或导入文件后从中摘录。每条知识都附带来源，可以随时打开原文核对。</p>
    <div class="ch-actions"><button class="ch-btn ch-btn--primary">新建</button><button class="ch-btn ch-btn--secondary">导入文件</button></div>
  </div>
  <div class="ch-empty">
    <h3 class="ch-empty-title">没有找到“令牌刷新”相关的知识</h3>
    <p class="ch-empty-text">当前筛选：待验证。清除筛选后可在全部知识中搜索。</p>
    <div class="ch-actions"><button class="ch-btn ch-btn--secondary">清除筛选</button></div>
  </div>
</div>
</body>
</html>
