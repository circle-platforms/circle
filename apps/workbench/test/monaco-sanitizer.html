<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monaco sanitizer fixture</title>
  </head>
  <body>
    <script type="module">
      import purify from 'dompurify';
      import { sanitizeHtml } from '/node_modules/monaco-editor/esm/vs/base/browser/domSanitize.js';

      const original = purify.sanitize;
      let calls = 0;
      purify.sanitize = function (...args) {
        calls++;
        return original.apply(this, args);
      };
      const clean = sanitizeHtml(
        '<strong>kept</strong><a href="https://example.com/">safe</a>' +
          '<span onmouseover="window.executed = true">unsafe event</span>' +
          '<a href="javascript:window.executed = true">unsafe</a>',
      );
      purify.sanitize = original;
      const element = document.createElement('div');
      element.innerHTML = clean;
      window.sanitizerResult = {
        version: purify.version,
        calls,
        html: element.innerHTML,
        text: element.textContent,
        unsafeAttributes: element.querySelectorAll(
          '[onmouseover], [href^="javascript:"]',
        ).length,
      };
    </script>
  </body>
</html>
